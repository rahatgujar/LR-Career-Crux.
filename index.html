<style>
:root{--b9:#0b1f4d;--b8:#12307a;--b7:#1d4ed8;--b6:#2563eb;--b5:#3b82f6;--b1:#e8f0ff;--b0:#f5f8ff;--gold:#f5b301;--gold2:#ffd54a;--ink:#0f172a;--mut:#5b6b86;--line:#e3e9f5;--r:20px;--sh:0 10px 30px rgba(29,78,216,.08);--sh2:0 24px 50px rgba(29,78,216,.16)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:"Plus Jakarta Sans",system-ui,sans-serif;color:var(--ink);background:#fff;line-height:1.65;overflow-x:hidden;font-size:16px}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:6px}
.skip{position:absolute;left:-999px;top:8px;background:var(--b7);color:#fff;padding:10px 16px;border-radius:10px;z-index:999}.skip:focus{left:8px}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
h1,h2,h3,h4{line-height:1.15;letter-spacing:-.02em;color:var(--b9)}
h1{font-size:clamp(2.2rem,5.4vw,4rem);font-weight:800}
h2{font-size:clamp(1.8rem,3.6vw,2.7rem);font-weight:800}
h3{font-size:1.2rem;font-weight:700}
.gold{color:var(--gold)}
.grad{background:linear-gradient(90deg,var(--b7),var(--b5),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200% auto;animation:gm 6s linear infinite}
@keyframes gm{to{background-position:200% center}}
.eyebrow{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;background:var(--b1);color:var(--b7);font-weight:700;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase}
.eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--gold)}
.lead{color:var(--mut);font-size:1.08rem;max-width:640px}
section{padding:90px 0}
.sec-h{text-align:center;max-width:720px;margin:0 auto 50px}.sec-h h2{margin:14px 0 12px}.sec-h .lead{margin:0 auto}
.alt{background:var(--b0)}
/* buttons */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 24px;border-radius:14px;font-weight:700;border:0;cursor:pointer;transition:transform .2s,box-shadow .2s,background .2s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.45),transparent 70%);transform:translateX(-110%);transition:transform .6s}
.btn:hover::after{transform:translateX(110%)}
.btn-p{background:linear-gradient(135deg,var(--b7),var(--b5));color:#fff;box-shadow:0 10px 24px rgba(37,99,235,.3)}.btn-p:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(37,99,235,.4)}
.btn-g{background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--b9);box-shadow:0 10px 24px rgba(245,179,1,.3)}.btn-g:hover{transform:translateY(-2px)}
.btn-o{background:#fff;color:var(--b7);border:1.5px solid var(--line)}.btn-o:hover{border-color:var(--b5);transform:translateY(-2px)}
.btn-wa{background:#22c55e;color:#fff}.btn-wa:hover{background:#16a34a;transform:translateY(-2px)}
.btn-sm{min-height:40px;padding:8px 16px;font-size:.9rem;border-radius:11px}
.row-btn{display:flex;gap:12px;flex-wrap:wrap}
/* nav */
header.nav{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.85);backdrop-filter:blur(14px);border-bottom:1px solid transparent;transition:all .3s}
header.nav.shrink{border-color:var(--line);box-shadow:0 6px 20px rgba(15,23,42,.06)}
.nav-in{display:flex;align-items:center;justify-content:space-between;height:78px;transition:height .3s}
.shrink .nav-in{height:62px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--b9);letter-spacing:.02em}
.logo .mk{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--b7),var(--b5));color:#fff;display:grid;place-items:center;font-size:.95rem;position:relative}
.logo .mk::after{content:"";position:absolute;right:-3px;top:-3px;width:12px;height:12px;border-radius:50%;background:var(--gold);border:2px solid #fff}
.logo small{display:block;font-size:.62rem;font-weight:600;color:var(--mut);letter-spacing:.12em}
.menu{display:flex;align-items:center;gap:4px}
.menu a{padding:8px 12px;border-radius:10px;font-weight:600;font-size:.93rem;color:#334155;transition:all .2s}
.menu a:hover{background:var(--b1);color:var(--b7)}
.menu a.on{color:var(--b7);background:var(--b1)}
.burger{display:none;width:46px;height:46px;border-radius:12px;border:1.5px solid var(--line);background:#fff;cursor:pointer;position:relative}
.burger span{position:absolute;left:12px;right:12px;height:2px;background:var(--b9);transition:all .3s}
.burger span:nth-child(1){top:15px}.burger span:nth-child(2){top:22px}.burger span:nth-child(3){top:29px}
.burger[aria-expanded=true] span:nth-child(1){top:22px;transform:rotate(45deg)}.burger[aria-expanded=true] span:nth-child(2){opacity:0}.burger[aria-expanded=true] span:nth-child(3){top:22px;transform:rotate(-45deg)}
/* page transition */
#app{min-height:70vh}
.page{animation:pg .5s ease both}
@keyframes pg{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
/* hero */
.hero{position:relative;padding:70px 0 90px;overflow:hidden;background:radial-gradient(800px 400px at 90% 0%,#dbe8ff,transparent 60%),radial-gradient(600px 400px at 0% 100%,#fff4cc,transparent 60%),#fff}
.hero-g{display:grid;grid-template-columns:1.05fr .95fr;gap:50px;align-items:center}
.hero h1{margin:18px 0}
.hero .row-btn{margin-top:30px}
.visual{position:relative;height:500px}
.vmap{position:absolute;inset:30px;border-radius:28px;background:linear-gradient(160deg,var(--b7),var(--b9));overflow:hidden;box-shadow:var(--sh2)}
.vmap img{width:100%;height:100%;object-fit:cover;opacity:.35;mix-blend-mode:luminosity}
.vmap svg{position:absolute;inset:0;width:100%;height:100%}
.vmap path.rt{stroke-dasharray:6 8;animation:dash 4s linear infinite}
@keyframes dash{to{stroke-dashoffset:-70}}
.fc{position:absolute;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.8);border-radius:16px;padding:12px 16px;box-shadow:var(--sh2);display:flex;gap:12px;align-items:center;animation:fl 6s ease-in-out infinite;font-size:.88rem}
.fc .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:1.2rem;background:var(--b1);flex:none}
.fc b{display:block;color:var(--b9);font-size:.92rem}.fc small{color:var(--mut)}
.fc1{top:0;left:-10px}.fc2{top:42%;right:-14px;animation-delay:-2s}.fc3{bottom:0;left:30px;animation-delay:-4s}
.fc .ic.y{background:#fff4cc}
@keyframes fl{50%{transform:translateY(-12px)}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:-40px;position:relative;z-index:3}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:24px;text-align:center;box-shadow:var(--sh);transition:transform .3s}
.stat:hover{transform:translateY(-5px)}
.stat .n{font-size:2.3rem;font-weight:800;color:var(--b7)}.stat .n span{color:var(--gold)}
.stat p{color:var(--mut);font-size:.9rem;font-weight:600}
.note{font-size:.78rem;color:var(--mut);text-align:center;margin-top:10px}
/* cards */
.grid{display:grid;gap:22px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:28px;transition:transform .3s,box-shadow .3s,border-color .3s;position:relative}
.card:hover{transform:translateY(-6px);box-shadow:var(--sh2);border-color:#c9d8f7}
.ico{width:54px;height:54px;border-radius:15px;display:grid;place-items:center;font-size:1.5rem;background:linear-gradient(135deg,var(--b1),#fff);border:1px solid var(--line);margin-bottom:18px;transition:transform .4s}
.card:hover .ico{transform:rotate(-8deg) scale(1.08);background:linear-gradient(135deg,#fff4cc,#fff)}
.card h3{margin-bottom:8px}.card p{color:var(--mut);font-size:.95rem}
.card .more{margin-top:16px;display:inline-flex;gap:6px;font-weight:700;color:var(--b7);font-size:.92rem;background:none;border:0;cursor:pointer;padding:0}
.card .more:hover{color:var(--gold)}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:.74rem;font-weight:700;background:var(--b1);color:var(--b7)}
.badge.y{background:#fff4cc;color:#8a6200}.badge.g{background:#dcfce7;color:#166534}.badge.r{background:#fee2e2;color:#991b1b}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
/* page hero */
.ph{padding:70px 0 60px;background:linear-gradient(160deg,var(--b0),#fff 60%);position:relative;overflow:hidden}
.ph::after{content:"";position:absolute;width:420px;height:420px;border-radius:50%;right:-120px;top:-160px;background:radial-gradient(circle,rgba(245,179,1,.22),transparent 65%)}
.ph h1{margin:14px 0 14px;font-size:clamp(2rem,4.5vw,3.3rem)}
.crumb{font-size:.85rem;color:var(--mut);margin-bottom:6px}.crumb a{color:var(--b7)}
/* timeline */
.tl{position:relative;display:grid;gap:0}
.tl-h{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:10px;position:relative;overflow-x:auto;padding:10px 4px 20px}
.tl-h::before{content:"";position:absolute;left:30px;right:30px;top:38px;height:3px;background:var(--line)}
.tl-h .bar{position:absolute;left:30px;top:38px;height:3px;background:linear-gradient(90deg,var(--b7),var(--gold));width:0;transition:width 1.6s ease}
.tl-h.in .bar{width:calc(100% - 60px)}
.tl-s{text-align:center;position:relative;min-width:110px;cursor:pointer;background:none;border:0;padding:0}
.tl-s .d{width:56px;height:56px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;background:#fff;border:3px solid var(--line);font-weight:800;color:var(--b7);transition:all .4s;position:relative;z-index:1}
.tl-h.in .tl-s .d{border-color:var(--b6)}
.tl-s.act .d,.tl-s:hover .d{background:var(--b7);color:#fff;transform:scale(1.08);box-shadow:0 0 0 6px var(--b1)}
.tl-s b{font-size:.86rem;color:var(--b9);display:block}
.tl-detail{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:24px;box-shadow:var(--sh);margin-top:10px;min-height:110px}
.vt{border-left:3px solid var(--line);margin-left:14px;padding-left:28px}
.vt .it{position:relative;padding-bottom:28px}
.vt .it::before{content:"";position:absolute;left:-38px;top:2px;width:17px;height:17px;border-radius:50%;background:#fff;border:3px solid var(--b6)}
.vt .it.reveal.in::before{background:var(--gold);border-color:var(--gold)}
/* titled cards */
.card h3{position:relative;padding-bottom:10px}
.card h3::after{content:"";position:absolute;left:0;bottom:0;width:42px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--gold),var(--b6))}
.svc{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);display:flex;flex-direction:column;transition:transform .3s,box-shadow .3s}
.svc:hover{transform:translateY(-6px);box-shadow:var(--sh2)}
.svc .sh{background:linear-gradient(135deg,var(--b9),var(--b7));color:#fff;padding:18px 20px;display:flex;align-items:center;gap:12px}
.svc .sh .si{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:1.35rem;flex:none}
.svc .sh h3{color:#fff;font-size:1.08rem;margin:0;padding:0}.svc .sh h3::after{display:none}
.svc .sh small{display:block;color:#c7d6ff;font-size:.74rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.svc .sb{padding:18px 20px;flex:1;display:flex;flex-direction:column;gap:12px}
.svc .sb p{color:var(--mut);font-size:.93rem;flex:1}
.svc .sf{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.svc .pr{font-weight:800;color:var(--b9);font-size:1.15rem}
.svc .pr.free{color:#15803d}.svc .pr.var{color:#8a6200;font-size:.95rem}
.svc.gold .sh{background:linear-gradient(135deg,#8a6200,var(--gold))}
.svc.green .sh{background:linear-gradient(135deg,#14532d,#16a34a)}
.svc.purple .sh{background:linear-gradient(135deg,#3b0764,#7c3aed)}
.cat-h{display:flex;align-items:center;gap:12px;margin:46px 0 18px}.cat-h:first-child{margin-top:0}
.cat-h h3{font-size:1.35rem}.cat-h span{flex:1;height:2px;background:var(--line)}
.paybox{background:linear-gradient(135deg,#ff6b00,#ff9a3c);color:#fff;border-radius:24px;padding:30px;box-shadow:var(--sh2)}
.paybox h3{color:#fff;font-size:1.4rem}.paybox h3::after{display:none}
.paybox .acc{background:rgba(255,255,255,.16);border:1px dashed rgba(255,255,255,.6);border-radius:16px;padding:16px 18px;margin:16px 0}
.paybox .acc div{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-weight:600}
.paybox .acc b{font-size:1.1rem;letter-spacing:.03em}
.paybox ol{margin:10px 0 0 20px;line-height:1.9}
.copy{background:#fff;color:#c2410c;border:0;border-radius:999px;padding:4px 12px;font-weight:800;font-size:.78rem;cursor:pointer}
.drop{border:2px dashed var(--line);border-radius:16px;padding:22px;text-align:center;cursor:pointer;transition:border .2s,background .2s;background:var(--b0)}
.drop:hover,.drop.on{border-color:var(--b6);background:var(--b1)}
.drop img{max-width:100%;max-height:220px;border-radius:12px;margin-top:10px;display:none}
.founder{display:grid;grid-template-columns:160px 1fr;gap:28px;align-items:center}
.founder .av{width:160px;height:160px;border-radius:50%;background:linear-gradient(135deg,var(--b7),var(--gold));display:grid;place-items:center;color:#fff;font-size:3rem;font-weight:800;box-shadow:var(--sh2);overflow:hidden;border:4px solid #fff;position:relative}
.founder .av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top}
.ceo-msg{position:relative;margin-top:22px;padding:38px 34px 30px;border-left:5px solid var(--gold);background:linear-gradient(135deg,#fff,var(--b0))}
.ceo-msg .qm{position:absolute;top:-6px;left:22px;font-size:5.5rem;line-height:1;color:var(--gold);font-family:Georgia,serif;opacity:.55}
.ceo-msg h3{margin:0 0 14px;color:var(--b9)}
.ceo-msg p{margin:0 0 12px;line-height:1.75;color:var(--ink)}
.ceo-msg .sig{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.ceo-msg .sig b{display:block;font-size:1.1rem;color:var(--b8);font-family:Georgia,serif;font-style:italic}
.ceo-msg .sig span{color:var(--mut);font-size:.92rem}
@media(max-width:600px){.ceo-msg{padding:34px 20px 24px}}
@media(max-width:600px){.founder{grid-template-columns:1fr;text-align:center}.founder .av{margin:0 auto}}
/* rate list */
.rate{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:24px}
.rate h3{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.rate .rl{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 0;border-bottom:1px dashed var(--line)}
.rate .rl:last-of-type{border-bottom:0}
.rate .rl span{color:#334155;font-weight:600}
.rate .rl b{white-space:nowrap;background:#fff4cc;color:#8a6200;padding:5px 12px;border-radius:999px;font-size:.9rem}
.rate .rl.hit{background:#eef5ff;border-radius:10px;padding:12px 10px}
.session{display:inline-block;background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--b9);font-weight:800;padding:6px 14px;border-radius:999px;font-size:.85rem}
/* packages */
.pk{display:flex;flex-direction:column}
.pk.feat{border:2px solid var(--b6);box-shadow:var(--sh2)}
.pk .ribbon{position:absolute;top:-13px;right:20px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--b9);font-weight:800;font-size:.75rem;padding:5px 12px;border-radius:999px}
.pk .price{font-size:2rem;font-weight:800;color:var(--b9);margin:10px 0}.pk .price small{font-size:.9rem;color:var(--mut);font-weight:600}
.pk ul{list-style:none;margin:14px 0 22px;flex:1}
.pk li{padding:7px 0 7px 28px;position:relative;color:#334155;font-size:.95rem}
.pk li::before{content:"\2713";position:absolute;left:0;top:7px;width:20px;height:20px;border-radius:50%;background:#fff4cc;color:#8a6200;font-size:.72rem;display:grid;place-items:center;font-weight:800}
/* filters */
.filters{display:grid;grid-template-columns:2fr repeat(5,1fr);gap:10px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--sh);margin-bottom:26px;position:sticky;top:72px;z-index:5}
.inp,.sel{width:100%;min-height:46px;padding:10px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);transition:border .2s,box-shadow .2s}
.inp:focus,.sel:focus{outline:none;border-color:var(--b5);box-shadow:0 0 0 4px var(--b1)}
.search{position:relative}.search .inp{padding-left:42px}.search::before{content:"\1F50D";position:absolute;left:14px;top:12px;font-size:.95rem;opacity:.6}
.count{color:var(--mut);font-size:.9rem;margin-bottom:14px}
.sc .top{display:flex;justify-content:space-between;align-items:start;gap:10px}
.sc .flag{font-size:2rem}
.sc dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.86rem;margin:12px 0}
.sc dt{color:var(--mut);font-weight:600}.sc dd{color:var(--ink)}
.empty{text-align:center;padding:60px 20px;border:2px dashed var(--line);border-radius:var(--r);color:var(--mut)}
.empty .e{font-size:2.6rem}
/* country */
.cc{padding:0;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.cc .im{height:170px;overflow:hidden;position:relative;background:var(--b1)}
.cc .im img{width:100%;height:100%;object-fit:cover;transition:transform .8s}
.cc:hover .im img{transform:scale(1.1)}
.cc .im .flag{position:absolute;left:16px;bottom:-22px;width:52px;height:52px;border-radius:14px;background:#fff;display:grid;place-items:center;font-size:1.7rem;box-shadow:var(--sh)}
.cc .bd{padding:32px 22px 22px;flex:1;display:flex;flex-direction:column}
.cc .bd p{flex:1}
/* split */
.split{display:grid;grid-template-columns:1fr 1fr;gap:50px;align-items:center}
.imgbox{border-radius:26px;overflow:hidden;box-shadow:var(--sh2);position:relative;height:420px}
.imgbox img{width:100%;height:120%;object-fit:cover;will-change:transform}
.chk{list-style:none;margin-top:18px}.chk li{padding:8px 0 8px 32px;position:relative}.chk li::before{content:"\2713";position:absolute;left:0;top:8px;width:22px;height:22px;border-radius:7px;background:var(--b7);color:#fff;font-size:.75rem;display:grid;place-items:center}
/* table */
.tbl{width:100%;border-collapse:collapse;background:#fff;border-radius:16px;overflow:hidden;box-shadow:var(--sh)}
.tbl th,.tbl td{padding:14px 16px;text-align:left;border-bottom:1px solid var(--line);font-size:.93rem}
.tbl th{background:var(--b7);color:#fff;font-weight:700}
.tbl-w{overflow-x:auto;border-radius:16px}
/* faq */
.faq-cats{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:24px}
.chip{padding:8px 16px;border-radius:999px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-weight:600;font-size:.88rem;min-height:40px;transition:all .2s}
.chip:hover{border-color:var(--b5)}.chip.on{background:var(--b7);border-color:var(--b7);color:#fff}
.qa{background:#fff;border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden;transition:box-shadow .3s}
.qa.open{box-shadow:var(--sh)}
.qa button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:14px;padding:18px 22px;background:none;border:0;cursor:pointer;text-align:left;font-weight:700;color:var(--b9);font-size:1rem}
.qa .pm{flex:none;width:30px;height:30px;border-radius:50%;background:var(--b1);color:var(--b7);display:grid;place-items:center;transition:transform .3s,background .3s;font-size:1.1rem}
.qa.open .pm{transform:rotate(45deg);background:var(--gold);color:var(--b9)}
.qa .ans{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.qa.open .ans{grid-template-rows:1fr}
.qa .ans>div{overflow:hidden}.qa .ans p{padding:0 22px 20px;color:var(--mut)}
/* assessment */
.asmt{max-width:760px;margin:0 auto}
.prog{height:10px;border-radius:999px;background:var(--b1);overflow:hidden;margin-bottom:22px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--b7),var(--gold));transition:width .4s}
.qcard{background:#fff;border:1px solid var(--line);border-radius:24px;padding:34px;box-shadow:var(--sh2);animation:pg .4s ease both}
.qcard h3{font-size:1.35rem;margin:10px 0 22px}
.opts{display:grid;gap:10px}
.opt{min-height:52px;padding:12px 18px;border:1.5px solid var(--line);border-radius:14px;background:#fff;cursor:pointer;text-align:left;font-weight:600;transition:all .2s;display:flex;align-items:center;gap:12px}
.opt:hover{border-color:var(--b5);background:var(--b0)}
.opt.sel{border-color:var(--b7);background:var(--b1);color:var(--b7)}
.opt .k{width:28px;height:28px;border-radius:8px;background:var(--b1);display:grid;place-items:center;font-size:.8rem;color:var(--b7);flex:none}
.res-bars{display:grid;gap:10px;margin:18px 0}
.rb{display:grid;grid-template-columns:130px 1fr 40px;gap:10px;align-items:center;font-size:.9rem;font-weight:600}
.rb .t{height:12px;border-radius:999px;background:var(--b1);overflow:hidden}.rb .t i{display:block;height:100%;background:linear-gradient(90deg,var(--b7),var(--b5));width:0;transition:width 1s ease}
.rb.top .t i{background:linear-gradient(90deg,var(--gold),var(--gold2))}
/* form */
.form{background:#fff;border:1px solid var(--line);border-radius:24px;padding:32px;box-shadow:var(--sh2)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.f{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.f label{font-weight:700;font-size:.86rem;color:var(--b9)}
.f label .req{color:#dc2626}
.f textarea{min-height:120px;resize:vertical}
.f .err{color:#dc2626;font-size:.8rem;min-height:1em;font-weight:600}
.f.bad .inp,.f.bad .sel{border-color:#f87171;background:#fff7f7}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:.86rem;color:var(--mut);margin-bottom:16px}
.consent input{margin-top:4px;width:18px;height:18px;accent-color:var(--b7)}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.contact-c a.card{display:flex;gap:14px;align-items:center;padding:20px}
/* cta band */
.band{border-radius:28px;padding:56px 40px;background:linear-gradient(135deg,var(--b7),var(--b9));color:#fff;position:relative;overflow:hidden;text-align:center}
.band h2{color:#fff}.band p{color:#c7d6fb;max-width:620px;margin:12px auto 26px}
.band::before{content:"";position:absolute;width:380px;height:380px;border-radius:50%;background:radial-gradient(circle,rgba(245,179,1,.35),transparent 65%);left:-100px;bottom:-200px}
.band .row-btn{justify-content:center;position:relative}
/* modal + toast */
.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(11,31,77,.55);backdrop-filter:blur(4px)}
.modal.open{display:flex;animation:fd .25s ease}
@keyframes fd{from{opacity:0}}
.mbox{background:#fff;border-radius:24px;max-width:680px;width:100%;max-height:88vh;overflow:auto;padding:32px;position:relative;animation:sc .3s cubic-bezier(.2,.8,.2,1)}
@keyframes sc{from{transform:scale(.94);opacity:0}}
.mx{position:absolute;right:16px;top:16px;width:42px;height:42px;border-radius:12px;border:0;background:var(--b1);cursor:pointer;font-size:1.2rem;color:var(--b9)}
.mbox h4{margin:18px 0 6px;color:var(--b7);font-size:.95rem;text-transform:uppercase;letter-spacing:.06em}
.mbox p,.mbox li{color:#334155;font-size:.95rem}.mbox ul{padding-left:20px}
#toasts{position:fixed;top:90px;right:20px;z-index:120;display:grid;gap:10px}
.toast{min-width:260px;max-width:360px;background:#fff;border-left:5px solid var(--b7);border-radius:14px;padding:14px 18px;box-shadow:var(--sh2);font-weight:600;animation:ti .35s ease both}
.toast.ok{border-color:#22c55e}.toast.err{border-color:#ef4444}
@keyframes ti{from{transform:translateX(30px);opacity:0}}
/* footer */
footer{background:var(--b9);color:#c7d6fb;padding:70px 0 26px;margin-top:40px}
footer h4{color:#fff;margin-bottom:14px;font-size:1rem}
.fgrid{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:30px}
footer ul{list-style:none}footer li{padding:5px 0}footer a:hover{color:var(--gold)}
footer .logo{color:#fff}footer .logo small{color:#8fa6d8}
.fbot{border-top:1px solid rgba(255,255,255,.12);margin-top:40px;padding-top:22px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;font-size:.88rem}
/* floating wa + mobile cta */
.wa-f{position:fixed;right:18px;bottom:18px;z-index:70;display:flex;align-items:center;gap:10px;background:#22c55e;color:#fff;border-radius:999px;padding:12px 18px 12px 14px;font-weight:700;box-shadow:0 12px 30px rgba(34,197,94,.45);animation:pu 2.6s infinite}
.wa-f svg{width:26px;height:26px}
@keyframes pu{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.5)}50%{box-shadow:0 0 0 14px rgba(34,197,94,0)}}
.mcta{display:none}
/* reveal */
.reveal{opacity:0;transform:translateY(28px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.8,.2,1)}
.reveal.sc-in{transform:scale(.94)}
.reveal.in{opacity:1;transform:none}
.legal h2{font-size:1.4rem;margin:28px 0 10px}.legal p,.legal li{color:#334155;margin-bottom:10px}.legal ul{padding-left:22px}
.e404{text-align:center;padding:120px 20px}.e404 .big{font-size:clamp(5rem,16vw,9rem);font-weight:800;line-height:1}
/* responsive */
@media(max-width:1080px){.menu{position:fixed;top:0;right:0;bottom:0;width:min(330px,86vw);flex-direction:column;align-items:stretch;background:#fff;padding:90px 22px 22px;box-shadow:-20px 0 50px rgba(15,23,42,.15);transform:translateX(105%);transition:transform .35s ease;gap:4px;z-index:65}
.menu.open{transform:none}.menu a{padding:14px 16px;font-size:1rem}.menu .btn{margin-top:10px}
.burger{display:block;z-index:66}
.filters{grid-template-columns:1fr 1fr 1fr;position:static}.filters .search{grid-column:1/-1}}
@media(max-width:900px){.hero-g,.split{grid-template-columns:1fr}.visual{height:400px}.g3,.g4{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr;margin-top:30px}.fgrid{grid-template-columns:1fr 1fr}section{padding:70px 0}.imgbox{height:300px}}
@media(max-width:600px){.g2,.g3,.g4,.fg{grid-template-columns:1fr}.filters{grid-template-columns:1fr 1fr}.visual{height:330px}.fc{font-size:.78rem;padding:10px 12px}.fc2{right:0}.fc1{left:0}.band{padding:40px 22px}.form,.qcard{padding:22px}.fgrid{grid-template-columns:1fr}.wa-f span{display:none}.wa-f{padding:14px;bottom:80px}
.mcta{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:69;padding:10px 14px;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-top:1px solid var(--line);gap:10px}.mcta .btn{flex:1}body{padding-bottom:70px}.rb{grid-template-columns:100px 1fr 34px}.stat .n{font-size:1.9rem}.hero{padding:40px 0 60px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}.reveal{opacity:1;transform:none}}

function shrinkImage(file) {
  return new Promise(function (res, rej) {
    var fr = new FileReader();
    fr.onerror = function () { rej(new Error("Could not read the file.")); };
    fr.onload = function () {
      var raw = fr.result; var im = new Image();
      im.onerror = function () { if (raw.length < 6000000) res(raw); else rej(new Error("Image is too large.")); };
      im.onload = function () {
        try {
          var max = 1400, w = im.width, h = im.height, s = Math.min(1, max / Math.max(w, h));
          var c = document.createElement("canvas"); c.width = Math.round(w * s); c.height = Math.round(h * s);
          c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
          res(c.toDataURL("image/jpeg", 0.82));
        } catch (e) { if (raw.length < 6000000) res(raw); else rej(e); }
      };
      im.src = raw;
    };
    fr.readAsDataURL(file);
  });
}

  $$("[data-copy]", root).forEach(function (b) { b.onclick = function () { var t = b.dataset.copy; (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { toast("Number copied", "ok"); }).catch(function () { toast(t, "ok"); }); }; });
  $$("[data-jump]", root).forEach(function (a) { a.onclick = function (e) { e.preventDefault(); var t = document.getElementById(a.dataset.jump); if (t) t.scrollIntoView({ behavior: "smooth" }); }; });
  if (location.hash.indexOf("pay=") > -1) { setTimeout(function () { var t = document.getElementById("pay"); if (t) t.scrollIntoView({ behavior: "smooth" }); }, 250); }
  $$(".tl-h", root).forEach(function (t) { if (io) io.observe(t); else t.classList.add("in"); });
}
function countryModal(id) {
  var c = country(id); if (!c) return;

}
function schModal(name) {

  openModal('<div style="font-size:2.4rem">' + (c.flag || "") + '</div><h2 id="mTitle" style="font-size:1.7rem">' + esc(s.name) + '</h2><div class="tags"><span class="badge">' + esc(c.name) + '</span><span class="badge y">' + esc(s.funding) + '</span><span class="badge g">' + esc(s.status) + '</span></div><h4>Degree level</h4><p>' + esc(s.degree.join(", ")) + '</p><h4>Field</h4><p>' + esc(s.field) + '</p><h4>Deadline</h4><p>' + esc(s.deadline) + '</p><h4>Eligibility</h4><p>' + esc(s.eligibility) + '</p><h4>Official source</h4><p><a style="color:var(--b7);word-break:break-all" href="' + esc(s.source) + '" target="_blank" rel="noopener">' + esc(s.source) + '</a></p><div class="row-btn" style="margin-top:22px"><a class="btn btn-p" href="#/contact?type=scholarship&program=Scholarship%20Inquiry&country=' + encodeURIComponent(c.name || "") + '&message=' + encodeURIComponent("Scholarship: " + s.name) + '">Get help applying</a><a class="btn btn-wa" href="' + wa("Hi, I'd like to ask about " + s.name + ".") + '" target="_blank" rel="noopener">Ask About Scholarships</a></div>');
}
function initScholarships() {
  var els = ["sq", "fc", "fd", "ff", "fs", "fo"].map(function (i) { return $("#" + i); });
  var run = function () {
    var q = els[0].value.trim().toLowerCase(), c = els[1].value, d = els[2].value, f = els[3].value, s = els[4].value, o = els[5].value;
    var list = CONFIG.scholarships.filter(function (x) { var cn = (country(x.country) || {}).name || ""; return (!q || (x.name + " " + cn + " " + x.field + " " + x.funding).toLowerCase().indexOf(q) > -1) && (!c || x.country === c) && (!d || x.degree.indexOf(d) > -1) && (!f || x.funding.indexOf(f) > -1 || (f === "Partially" && x.funding.indexOf("Partially") > -1)) && (!s || x.status === s) && x.status !== "Closed"; });
    list.sort(function (a, b) { return o === "deadline" ? ((a.month || 13) - (b.month || 13)) : a.name.localeCompare(b.name); });
    $("#schCount").textContent = list.length + " scholarship" + (list.length === 1 ? "" : "s") + " found";
    $("#schList").innerHTML = list.length ? list.map(ScholarshipCard).join("") : '<div class="empty" style="grid-column:1/-1"><div class="e">\uD83D\uDD0E</div><h3>No scholarships match</h3><p>Try clearing a filter or searching a different keyword.</p><button class="btn btn-o btn-sm" id="clr" style="margin-top:14px">Clear filters</button></div>';
    bindDynamic($("#schList")); var clr = $("#clr"); if (clr) clr.onclick = function () { els.forEach(function (e) { e.value = e.id === "fo" ? "name" : ""; }); run(); };
  };
  var t; els[0].addEventListener("input", function () { clearTimeout(t); t = setTimeout(run, 150); });
  els.slice(1).forEach(function (e) { e.addEventListener("change", run); });
  setTimeout(run, 200);
}
function initCountries() {
  var run = function () { var q = $("#cq").value.trim().toLowerCase(), t = $("#ct").value.toLowerCase(); var list = CONFIG.countries.filter(function (c) { var hay = (c.name + " " + c.tags.join(" ") + " " + c.programs.join(" ")).toLowerCase(); return (!q || hay.indexOf(q) > -1) && (!t || hay.indexOf(t) > -1); }); $("#cCount").textContent = list.length + " destination" + (list.length === 1 ? "" : "s"); $("#cList").innerHTML = list.length ? list.map(CountryCard).join("") : '<div class="empty" style="grid-column:1/-1"><div class="e">\uD83C\uDF0D</div><h3>No destinations match</h3><p>Try another keyword.</p></div>'; bindDynamic($("#cList")); };
  $("#cq").addEventListener("input", run); $("#ct").addEventListener("change", run); run();
}
/* assessment */
var A = { i: 0, ans: [] };
function initAssessment() { A = { i: 0, ans: [] }; drawQ(); }
function drawQ() {
  var R = CONFIG.riasec, box = $("#asmtBox"); if (!box) return;
  if (A.i >= R.questions.length) return drawResult();
  var q = R.questions[A.i];
  box.innerHTML = '<div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="' + R.questions.length + '" aria-valuenow="' + A.i + '"><i style="width:' + (A.i / R.questions.length * 100) + '%"></i></div><div class="qcard"><span class="badge">Question ' + (A.i + 1) + " of " + R.questions.length + '</span><h3>' + esc(q[0]) + '</h3><div class="opts">' + R.scale.map(function (s, k) { return '<button class="opt ' + (A.ans[A.i] === k ? "sel" : "") + '" data-k="' + k + '"><span class="k">' + (k + 1) + "</span>" + esc(s) + "</button>"; }).join("") + '</div><div class="row-btn" style="justify-content:space-between;margin-top:20px"><button class="btn btn-o btn-sm" id="qBack" ' + (A.i === 0 ? "disabled style=opacity:.5" : "") + '>&larr; Back</button><span style="color:var(--mut);font-size:.85rem;align-self:center">Tip: press 1–4</span></div></div>';
  $$(".opt", box).forEach(function (b) { b.onclick = function () { pick(+b.dataset.k); }; });
  $("#qBack").onclick = function () { if (A.i > 0) { A.i--; drawQ(); } };
}
function pick(k) { A.ans[A.i] = k; $$("#asmtBox .opt").forEach(function (b) { b.classList.toggle("sel", +b.dataset.k === k); }); setTimeout(function () { A.i++; drawQ(); }, 220); }
document.addEventListener("keydown", function (e) { if (!$("#asmtBox") || $("#modal").classList.contains("open")) return; if (/^[1-4]$/.test(e.key) && A.i < CONFIG.riasec.questions.length && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) pick(+e.key - 1); });
function drawResult() {
  var R = CONFIG.riasec, sc = { R: 0, I: 0, A: 0, S: 0, E: 0, C: 0 };
  R.questions.forEach(function (q, i) { sc[q[1]] += (A.ans[i] || 0); });
  var order = Object.keys(sc).sort(function (a, b) { return sc[b] - sc[a]; }), top = order.slice(0, 2), max = 6;
  var careers = []; top.forEach(function (t) { R.careers[t].forEach(function (c) { if (careers.indexOf(c) < 0) careers.push(c); }); });
  var code = top.join(""), summary = code + " (" + top.map(function (t) { return R.labels[t]; }).join(" + ") + ") → " + careers.slice(0, 5).join(", ");
  $("#asmtBox").innerHTML = '<div class="qcard"><span class="badge y">Your result</span><h3 style="margin-bottom:6px">Your interest code: <span class="grad">' + code + '</span></h3><p class="lead" style="font-size:1rem">You lean most toward <b>' + R.labels[top[0]] + '</b> and <b>' + R.labels[top[1]] + '</b> interests.</p><div class="res-bars">' + order.map(function (t) { return '<div class="rb ' + (top.indexOf(t) > -1 ? "top" : "") + '"><span>' + R.labels[t] + '</span><span class="t"><i data-w="' + Math.round(sc[t] / max * 100) + '"></i></span><span>' + sc[t] + "</span></div>"; }).join("") + '</div><h4 style="color:var(--b7);margin:16px 0 8px">Suggested fields to explore</h4><div class="tags">' + careers.map(function (c) { return '<span class="badge y">' + esc(c) + "</span>"; }).join("") + '</div><p class="note" style="text-align:left">This is a guidance tool, not a final diagnosis. Discuss results with a counselor before deciding.</p><div class="row-btn" style="margin-top:18px"><button class="btn btn-p" id="sendRes">Get my detailed result</button><button class="btn btn-o" id="redo">Retake</button></div></div>';
  setTimeout(function () { $$("#asmtBox .rb i").forEach(function (i) { i.style.width = i.dataset.w + "%"; }); }, 60);
  $("#redo").onclick = initAssessment;
  $("#sendRes").onclick = function () { location.hash = "#/contact?type=assessment&program=Career%20Counseling&message=" + encodeURIComponent("Assessment result: " + summary); sessionStorage.setItem("lr_assess", summary); };
  toast("Assessment complete! Your interest code is " + code + ".", "ok");
}
/* form */
function initForm(form) {
  var rules = {
    full_name: function (v) { return v.length < 2 ? "Please enter your full name." : ""; },
    email: function (v) { return !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v) ? "Please enter a valid email." : ""; },
    phone: function (v) { return !/^\+?[0-9\s-]{10,16}$/.test(v) ? "Please enter a valid WhatsApp number." : ""; },
    qualification: function (v) { return !v ? "Please select your qualification." : ""; }
  };
  var started = Date.now();
  var check = function (name) { var el = form.elements[name]; if (!el || !rules[name]) return true; var m = rules[name](el.value.trim()); var f = el.closest(".f"); f.classList.toggle("bad", !!m); $(".err", f).textContent = m; el.setAttribute("aria-invalid", !!m); return !m; };
  Object.keys(rules).forEach(function (n) { var el = form.elements[n]; el.addEventListener("blur", function () { check(n); }); el.addEventListener("input", function () { if (el.closest(".f").classList.contains("bad")) check(n); }); });
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var ok = Object.keys(rules).map(check).every(Boolean);
    if (!form.elements.consent.checked) { toast("Please accept the Privacy Policy to continue.", "err"); ok = false; }
    if (!ok) { var first = $(".f.bad .inp, .f.bad .sel", form); if (first) first.focus(); return; }
    if (form.elements.website.value || Date.now() - started < 2500) { toast("Thank you! We will contact you soon.", "ok"); form.reset(); return; } // spam trap
    var data = {}; ["lead_type", "full_name", "email", "phone", "destination", "qualification", "program", "message"].forEach(function (k) { data[k] = (form.elements[k].value || "").trim().slice(0, 1500); });
    data.source_page = location.hash || "#/"; data.assessment_result = data.lead_type === "assessment" ? (sessionStorage.getItem("lr_assess") || "") : ""; data.website = "";
    var btn = $('button[type="submit"]', form), label = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Sending...';
    Api.submitLead(data).then(function (r) {
      form.innerHTML = '<div style="text-align:center;padding:30px 10px"><div style="font-size:3rem">\u2705</div><h3 style="margin:10px 0">Thank you, ' + esc(data.full_name.split(" ")[0]) + '!</h3><p class="lead" style="margin:0 auto 20px">We received your details' + (r.mock ? " (demo mode)" : "") + '. An advisor will contact you on WhatsApp or email soon.</p><a class="btn btn-wa" href="' + wa("Hi LR Career Crux, I just submitted the form on your website. My name is " + data.full_name + ".") + '" target="_blank" rel="noopener">Chat With LR Career Crux</a></div>';
      toast("Your details were sent successfully.", "ok");
    }).catch(function () { btn.disabled = false; btn.innerHTML = label; toast("Sorry, we could not send your details. Please try again or message us on WhatsApp.", "err"); });
  });
}

burger.onclick = function () { var o = menu.classList.toggle("open"); burger.setAttribute("aria-expanded", o); burger.setAttribute("aria-label", o ? "Close menu" : "Open menu"); };

window.addEventListener("scroll", function () { if (ticking) return; ticking = true; requestAnimationFrame(function () { nav.classList.toggle("shrink", scrollY > 30); if (!reduce) $$("[data-parallax]").forEach(function (im) { var r = im.parentElement.getBoundingClientRect(); im.style.transform = "translateY(" + (-(r.top * 0.08)) + "px)"; }); ticking = false; }); }, { passive: true });
